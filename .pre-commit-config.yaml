# Install with `uvx pre-commit install`. Hooks use the project's own toolchains.
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff (backend)
        entry: bash -c 'cd backend && uv run ruff check --fix . && uv run ruff format .'
        language: system
        files: ^backend/
        pass_filenames: false
      - id: eslint
        name: eslint (frontend)
        entry: bash -c 'cd frontend && npm run lint --silent'
        language: system
        files: ^frontend/src/
        pass_filenames: false
      - id: tsc
        name: tsc (frontend)
        entry: bash -c 'cd frontend && npm run typecheck --silent'
        language: system
        files: ^frontend/
        pass_filenames: false
